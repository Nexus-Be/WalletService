# =============================================================================
# NEXUS WALLET SERVICE - DOCKER COMPOSE
# =============================================================================
# Start Wallet Service:
#   docker compose up
#
# PostgreSQL is hosted externally (for example, on Neon Cloud). Configure
# CONNECTION_STRING in the local environment or .env file before starting.
# =============================================================================

services:

  # 1. Ứng dụng Wallet Service RESTful Web API (Port 8008)
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${WALLET_CONNECTION_STRING:-${CONNECTION_STRING:-}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
