# =============================================================================
# NEXUS WALLET SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Wallet Service kèm Cơ sở dữ liệu riêng:
#   docker compose up -d
# =============================================================================

services:

  # 1. Cơ sở dữ liệu Wallet Service (Port 5440)
  wallet-db:
    image: postgres:16-alpine
    container_name: nexus-wallet-db
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${WALLET_DB_PORT:-5440}:5432"
    volumes:
      - wallet_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d wallet_db"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s

  # 2. Ứng dụng Wallet Service gRPC (Port 8008)
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:-Host=wallet-db;Port=5432;Database=wallet_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      wallet-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: nexus-network

volumes:
  wallet_db_data:
    name: nexus-be_wallet_db_data
