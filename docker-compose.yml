# =============================================================================
# NEXUS WALLET SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Wallet Service:
#   CSDL chính lưu trên PostgreSQL cục bộ (port 5440 hoặc nexus-wallet-db)
#   docker compose up -d
# =============================================================================

services:

  # 1. Ứng dụng Wallet Service RESTful Web API (Port 8008)
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${WALLET_CONNECTION_STRING:-${CONNECTION_STRING:-Host=wallet-db;Port=5432;Database=wallet_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
