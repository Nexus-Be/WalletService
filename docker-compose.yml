services:
  api:
    image: oaktree293/walletservice
    container_name: nexus-wallet-service
    ports:
      - "8008:8008"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${NEON_CONNECTION_STRING:?Set NEON_CONNECTION_STRING in .env to your Neon connection string}
      RabbitMq__Host: ${RabbitMq__Host:-host.docker.internal}
      RabbitMq__Port: ${RabbitMq__Port:-5672}
      RabbitMq__User: ${RabbitMq__User:-guest}
      RabbitMq__Password: ${RabbitMq__Password:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
    restart: unless-stopped
