# =============================================================================
# NEXUS WALLET SERVICE - DOCKER COMPOSE
# =============================================================================
# Start the local database first with docker-compose.db.yml.
# WALLET_CONNECTION_STRING may override the local database connection when needed.
# Lệnh: docker compose up -d --build
# =============================================================================

name: nexus-wallet

services:
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${WALLET_CONNECTION_STRING:-${WALLET_DB_CONNECTION:-}}"
      VnPay__TmnCode: "${VNPAY_TMN_CODE:-}"
      VnPay__HashSecret: "${VNPAY_HASH_SECRET:-}"
      VnPay__PaymentUrl: "${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
      VnPay__ReturnUrl: "${VNPAY_RETURN_URL:-https://localhost:8080/api/v1/wallets/vnpay/return}"
      VnPay__Version: "${VNPAY_VERSION:-2.1.0}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      Stripe__SuccessUrl: "${STRIPE_SUCCESS_URL:-}"
      Stripe__CancelUrl: "${STRIPE_CANCEL_URL:-}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}"
      InternalSecurity__AuctionServiceKey: "${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}"
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification-service:8007}"
      Services__Notification__ServiceKey: "${NOTIFICATION_SERVICE_KEY:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      # Release gates. Refunds are closed by default because the sub-order refund route used to credit the buyer without checking the
      # payment or the escrow. LegacyCommerceSettlementEnabled is set on its own so that closing the refunds does not also stop the V1 seller
      # payout (that route falls back to the legacy credits flag when its own flag is not set). Open the refunds only with
      # ORDER_REFUND_ENABLED=true, after the refund path has been fixed and checked.
      ReleaseFeatures__OrderRefundEnabled: "${ORDER_REFUND_ENABLED:-false}"
      ReleaseFeatures__LegacyCommerceCreditsEnabled: "${LEGACY_COMMERCE_CREDITS_ENABLED:-false}"
      ReleaseFeatures__LegacyCommerceSettlementEnabled: "${LEGACY_COMMERCE_SETTLEMENT_ENABLED:-true}"
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
