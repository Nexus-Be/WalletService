# =============================================================================
# NEXUS WALLET SERVICE - DOCKER COMPOSE
# =============================================================================
# Start Wallet Service:
#   docker compose up
#
# PostgreSQL is hosted externally (for example, on Neon Cloud). Configure
# CONNECTION_STRING in the local environment or .env file before starting.
# =============================================================================

services:

  wallet-service:
    image: oaktree293/walletservice
    container_name: nexus-wallet-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?Set CONNECTION_STRING in your environment or .env file}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
