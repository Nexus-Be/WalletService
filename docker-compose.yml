# =============================================================================
# NEXUS WALLET SERVICE - DOCKER COMPOSE
# =============================================================================
# Start Wallet Service and the API Gateway:
#   docker compose up -d
#
# PostgreSQL is hosted externally (for example, on Neon Cloud). Configure
# CONNECTION_STRING in the local environment or .env file before starting.
# =============================================================================

services:
  api-gateway:
    image: oaktree293/apigateway:latest
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Services__WalletService: http://wallet-service:8008
    depends_on:
      - wallet-service
    restart: unless-stopped

  wallet-service:
    image: oaktree293/walletservice:latest
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?Set CONNECTION_STRING in your environment or .env file}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
