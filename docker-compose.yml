# =============================================================================
# NEXUS WALLET SERVICE - DOCKER COMPOSE
# =============================================================================
# Start the local database first with docker-compose.db.yml.
# WALLET_CONNECTION_STRING may override the local database connection when needed.
# Lệnh: docker compose up -d --build
# =============================================================================

name: nexus-wallet

services:
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8008}:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${WALLET_CONNECTION_STRING}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      Stripe__SuccessUrl: "${STRIPE_SUCCESS_URL:-}"
      Stripe__CancelUrl: "${STRIPE_CANCEL_URL:-}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
