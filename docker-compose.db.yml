name: nexus-db-wallet

services:
  postgres-wallet:
    image: postgres:16-alpine
    container_name: nexus-postgres-wallet
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wallet_db
    ports:
      - "${WALLET_DB_PORT:-5440}:5432"
    volumes:
      - postgres_wallet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_wallet_data:
    name: nexus-local_postgres_wallet_data

networks:
  default:
    name: nexus-network
    external: true
