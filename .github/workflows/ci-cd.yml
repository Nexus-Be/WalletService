name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Working-tree scan only. Switch to a full-history scan (drop --no-git)
      # once git history has been purged of the previously leaked secrets.
      - name: Scan for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose

  tests:
    runs-on: ubuntu-latest

    # Disposable PostgreSQL for the integration tests that are skipped when WALLET_STRIPE_TEST_DATABASE is not set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wallet_it_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wallet_it_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify CQRS Architecture
        run: ./scripts/verify-wallet-architecture.sh

      - name: Build Solution (Release)
        run: dotnet build Wallet.sln -c Release

      - name: Run Unit, Host Smoke & PostgreSQL Tests
        env:
          WALLET_STRIPE_TEST_DATABASE: "Host=localhost;Port=5432;Database=wallet_it_test;Username=postgres;Password=ci-only-password"
        run: dotnet test Wallet.sln -c Release --no-build --nologo --verbosity minimal

  build-and-push:
    needs: [secret-scan, tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.event_name == 'pull_request' && format('local/{0}', github.event.repository.name) || format('{0}/{1}', secrets.DOCKER_HUB_USERNAME, github.event.repository.name) }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

